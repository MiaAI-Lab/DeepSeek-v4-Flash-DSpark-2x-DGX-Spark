# Disk-backed KV cache (kv-disk-tier) overlay: mounts plus the container env the
# tier needs. Included by start-deepseek-v4-flash-dspark.sh ONLY when
# KV_DISK_CACHE_ENABLE=1, so a default-off launch never mounts (or requires) a
# staged KV_DISK_CACHE_SRC and renders the stock service env unchanged.
services:
  vllm-dspark:
    # The tier delta only. These keys stay out of the shared compose file: with
    # the switch off, an install whose .env.dspark predates the knob must render
    # exactly the pre-existing environment (VLLM_SKIP_INIT_MEMORY_CHECK is not in
    # the Anemll 0.1.1 registry and Stage-C already owns it in
    # docker-compose.stage-c.override.yml; VLLM_ENGINE_READY_TIMEOUT_S=3600 is
    # only needed for the slower disk-tier boot).
    environment:
      KV_DISK_CACHE_ENABLE: "${KV_DISK_CACHE_ENABLE:-1}"
      KV_DISK_CACHE_CPU_BYTES: "${KV_DISK_CACHE_CPU_BYTES:-4294967296}"
      KV_DISK_CACHE_BYTES: "${KV_DISK_CACHE_BYTES:-150000000000}"
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_SKIP_INIT_MEMORY_CHECK: "${VLLM_SKIP_INIT_MEMORY_CHECK:-1}"
      KV_DISK_CACHE_SHARD_HEAD: "${KV_DISK_CACHE_SHARD_HEAD:-tcp://${MASTER_ADDR:-10.0.0.1}:${KV_DISK_CACHE_SHARD_PORT:-25055}}"
      KV_DISK_CACHE_SHARD_PORT: "${KV_DISK_CACHE_SHARD_PORT:-25055}"
      KV_DISK_CACHE_SG_THRESHOLD: "${KV_DISK_CACHE_SG_THRESHOLD:-20000}"
      KV_DISK_CACHE_SG_SO: "${KV_DISK_CACHE_SG_SO:-/usr/local/lib/libdsv4_batch_copy.so}"
      KV_DISK_CACHE_MAX_COPIES_PER_BATCH: "${KV_DISK_CACHE_MAX_COPIES_PER_BATCH:-8192}"
      KV_DISK_CACHE_MAX_OFFLOAD_BLOCKS_PER_REQUEST: "${KV_DISK_CACHE_MAX_OFFLOAD_BLOCKS_PER_REQUEST:-0}"
      KV_DISK_CACHE_DIRECT_IO: "${KV_DISK_CACHE_DIRECT_IO:-0}"
      KV_DISK_CACHE_DIRECT_IO_SO: "${KV_DISK_CACHE_DIRECT_IO_SO:-/usr/local/lib/libdsv4_host_kv.so}"
      KV_DISK_CACHE_DIRECT_VERIFY: "${KV_DISK_CACHE_DIRECT_VERIFY:-0}"

    volumes:
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/dsv4_kv_disk_tier.py:/usr/local/lib/python3.12/dist-packages/dsv4_kv_disk_tier.py:ro
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/dsv4_shard_tier.py:/usr/local/lib/python3.12/dist-packages/dsv4_shard_tier.py:ro
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/dsv4_vllm_patches.py:/usr/local/lib/python3.12/dist-packages/dsv4_vllm_patches.py:ro
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/dsv4_sitecustomize.py:/usr/lib/python3.12/sitecustomize.py:ro
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/libdsv4_batch_copy.so:/usr/local/lib/libdsv4_batch_copy.so:ro
      - ${KV_DISK_CACHE_SRC:-/opt/dsv4-kv}/libdsv4_host_kv.so:/usr/local/lib/libdsv4_host_kv.so:ro
      - ${KV_DISK_CACHE_DIR:-${HOME}/kvdisk}:/kvdisk
