services:
  vllm:
    image: dgx34-vllm:0.28.0
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: 64gb
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${HOME}/.cache/huggingface:/cache/huggingface:ro
      - ${HOME}/.cache/vllm-028:/cache/vllm
      - ${HOME}/.cache/flashinfer-028:/cache/flashinfer
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_CACHE_ROOT: /cache/vllm
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_AOT_COMPILE: "0"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      CUTE_DSL_ARCH: sm_121a
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      FLASHINFER_WORKSPACE_BASE: /cache/flashinfer
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: rocep1s0f0
      NCCL_SOCKET_IFNAME: enp1s0f0np0
      TP_SOCKET_IFNAME: enp1s0f0np0
      GLOO_SOCKET_IFNAME: enp1s0f0np0
      NCCL_IB_GID_INDEX: "3"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_NVLS_ENABLE: "0"
      NCCL_DEBUG: WARN
      MASTER_ADDR: 10.0.3.2
      MASTER_PORT: "25000"
      VLLM_HOST_IP: ${VLLM_HOST_IP:?set per node}
      NODE_RANK: ${NODE_RANK:?set per node}
      HEADLESS: ${HEADLESS:-}
    command:
      - bash
      - -lc
      - >-
        exec vllm serve deepseek-ai/DeepSeek-V4-Flash-0731
        --revision 9e165c30e2704aec5d9d593cce3eebd58bbef1cb
        --served-model-name deepseek-v4-flash-0731
        --host 0.0.0.0 --port 8888
        --trust-remote-code
        --tensor-parallel-size 2 --pipeline-parallel-size 1
        --kv-cache-dtype fp8_ds_mla --block-size 256
        --max-model-len 1048576 --max-num-seqs 8 --max-num-batched-tokens 8192
        --long-prefill-token-threshold 1024 --max-cudagraph-capture-size 48
        --gpu-memory-utilization 0.835
        --enable-prefix-caching --enable-chunked-prefill
        --enable-prompt-tokens-details --async-scheduling
        --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
        --tokenizer-mode deepseek_v4
        --tool-call-parser deepseek_v4 --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --default-chat-template-kwargs '{"thinking":true,"reasoning_effort":"low"}'
        --generation-config vllm
        --compilation-config '{"cudagraph_mode":"FULL"}'
        --distributed-executor-backend mp
        --nnodes 2 --node-rank "$${NODE_RANK}"
        --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT}"
        $${HEADLESS:+--headless}
