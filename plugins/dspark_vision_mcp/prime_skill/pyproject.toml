[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-agent-skill-dspark-vision"
version = "0.1.0"
description = "Local Qwen3-VL sidecar vision helpers for Prime Agent"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dspark_vision*"]
