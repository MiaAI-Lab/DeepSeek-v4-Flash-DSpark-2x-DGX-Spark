# VL sidecar for the DSpark stack: Qwen3-VL-4B TP=2 across head + worker.
#
# Started by start-deepseek-v4-flash-dspark.sh when ENABLE_VL_SIDECAR=1
# (worker-first, then head API rank). Spreading weights across both Sparks
# cuts per-node VRAM so 0731 can keep a larger nvfp4 KV pool.
# DeepSeek-V4-Flash-0731 stays text-only; agents use plugins/dspark_vision_mcp.
# Same compose project (deepseek-v4-flash) so stop tears this down with the stack.
#
# Uses VL_SIDECAR_MASTER_PORT (default 25100), not DeepSeek MASTER_PORT (25000).
services:
  vl-sidecar:
    image: ${DSPARK_VLLM_IMAGE:-ghcr.io/anemll/dspark-vllm-gx10:0.1.1}
    pull_policy: if_not_present
    entrypoint: []
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      - ${DSPARK_TMP_HOST:-${HOME}/.cache/dspark-tmp}:/tmp

    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      CUTE_DSL_ARCH: "${CUTE_DSL_ARCH:-sm_121a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      FLASHINFER_WORKSPACE_BASE: "${FLASHINFER_WORKSPACE_BASE:-/cache/huggingface/flashinfer}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
      VLLM_SKIP_INIT_MEMORY_CHECK: "${VLLM_SKIP_INIT_MEMORY_CHECK:-1}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      VL_SIDECAR_MASTER_PORT: "${VL_SIDECAR_MASTER_PORT:-25100}"
      VL_SIDECAR_KV_CACHE_MEMORY_BYTES: "${VL_SIDECAR_KV_CACHE_MEMORY_BYTES:-}"

    command:
      - bash
      - -lc
      - >
        export PATH="/usr/local/cuda/bin:/usr/local/bin:$${PATH:-}";
        export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$${LD_LIBRARY_PATH:-}";
        VL_KV_BYTES_ARGS="";
        if [ -n "$${VL_SIDECAR_KV_CACHE_MEMORY_BYTES:-}" ]; then
          VL_KV_BYTES_ARGS="--kv-cache-memory-bytes $${VL_SIDECAR_KV_CACHE_MEMORY_BYTES}";
        fi;
        exec /usr/local/bin/vllm serve ${VL_SIDECAR_MODEL:-cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit}
        --served-model-name ${VL_SIDECAR_SERVED_NAME:-qwen3-vl-4b}
        --host 0.0.0.0
        --port ${VL_SIDECAR_PORT:-8889}
        --trust-remote-code
        --tensor-parallel-size ${VL_SIDECAR_TP_SIZE:-2}
        --nnodes ${VL_SIDECAR_NNODES:-2}
        --node-rank $${NODE_RANK}
        --master-addr $${MASTER_ADDR}
        --master-port $${VL_SIDECAR_MASTER_PORT:-25100}
        --distributed-executor-backend mp
        --max-model-len ${VL_SIDECAR_MAX_MODEL_LEN:-32768}
        --max-num-seqs ${VL_SIDECAR_MAX_NUM_SEQS:-4}
        --max-num-batched-tokens ${VL_SIDECAR_MAX_NUM_BATCHED_TOKENS:-2048}
        --gpu-memory-utilization ${VL_SIDECAR_GPU_UTIL:-0.03}
        --kv-cache-dtype ${VL_SIDECAR_KV_CACHE_DTYPE:-fp8}
        --attention-backend ${VL_SIDECAR_ATTENTION_BACKEND:-TRITON_ATTN}
        --no-enable-flashinfer-autotune
        --disable-custom-all-reduce
        --enable-prefix-caching
        --enable-chunked-prefill
        --limit-mm-per-prompt '{"image":4}'
        $${VL_KV_BYTES_ARGS}
        $${HEADLESS:+--headless}
