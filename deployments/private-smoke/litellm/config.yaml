model_list:
  - model_name: deepseek-v4-flash-0731-smoke
    litellm_params:
      model: openai/deepseek-v4-flash-0731
      api_base: http://172.30.0.1:8888/v1
      api_key: os.environ/VLLM_ORIGIN_KEY
      timeout: 900
      stream_timeout: 900
      num_retries: 0
    model_info:
      mode: chat

router_settings:
  num_retries: 0
  allowed_fails: 0
  fallbacks: []
  default_fallbacks: []
  context_window_fallbacks: []
  content_policy_fallbacks: []

litellm_settings:
  turn_off_message_logging: true
  json_logs: true
  drop_params: false
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  disable_spend_logs: false
  allow_requests_on_db_unavailable: false
